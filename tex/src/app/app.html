<div class="shell">
  <header class="topbar">
    <a class="brand" routerLink="/" (click)="closeMenu()">
      <span class="brand__mark" aria-hidden="true">T</span>
      <span class="brand__name">Tex</span>
    </a>

    <button
      class="burger"
      type="button"
      aria-label="Alternar menu"
      [attr.aria-expanded]="menuOpen()"
      (click)="menuOpen.set(!menuOpen())"
    >
      <span></span><span></span><span></span>
    </button>

    <nav class="nav" [class.is-open]="menuOpen()" aria-label="Navegação principal">
      <a
        class="nav__link"
        routerLink="/"
        routerLinkActive="is-active"
        [routerLinkActiveOptions]="{ exact: true }"
        (click)="closeMenu()"
      >
        Painel
      </a>
      <a class="nav__link" routerLink="/notas" routerLinkActive="is-active" (click)="closeMenu()">Notas</a>
      <a
        class="nav__link"
        routerLink="/preferencias"
        routerLinkActive="is-active"
        (click)="closeMenu()"
      >
        Preferências
      </a>
    </nav>

    <button
      class="theme-btn"
      type="button"
      [attr.aria-label]="themeLabel()"
      [title]="themeLabel()"
      (click)="toggleTheme()"
    >
      {{ settings.theme() === 'light' ? '🌙' : '☀️' }}
    </button>
  </header>

  <main class="main">
    <router-outlet />
  </main>

  <footer class="footer">
    <span>Tex — seu repositório de notas.</span>
    <span class="footer__sep">·</span>
    <span>Dados salvos localmente no navegador</span>
    <span class="footer__sep">·</span>
    <span>&copy; {{ year }}</span>
  </footer>
</div>

<app-toast-container />
